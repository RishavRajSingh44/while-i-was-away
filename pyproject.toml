[project]
name = "while-i-was-away"
version = "0.1.0"
description = "A local-first developer continuation briefing"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
away = ["migrations/*.sql", "prompts/*.txt"]
